name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  VSCMD_SKIP_SENDTELEMETRY: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  CMAKE_GENERATOR: Ninja

jobs:
  build_linux:
    name: ${{ matrix.config.name }} ${{ matrix.build.type }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        build:
          - {
              type: Debug,
              preset: conan-debug
            }
          - {
              type: RelWithDebInfo,
              preset: conan-relwithdebinfo
            }
        config:
          - {
              name: 'Linux GCC',
              cc: gcc-15,
              cxx: g++-15,
              gcov: gcov-15,
              profiles: '-pr:h conan/gcc15'
            }
          - {
              name: 'Linux Clang',
              cc: clang-22,
              cxx: clang++-22,
              gcov: llvm-cov-22 gcov,
              profiles: '-pr:h conan/clang22 -pr:h conan/libc++'
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> ${{ github.path }}
          echo "CONAN_HOME=${{ runner.temp }}/.conan2" >> ${{ github.env }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          sudo apt install libc++-22-dev libc++abi-22-dev
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-22 100
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install cppcheck
          uv sync
          uv run conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-
            conan-${{ runner.os }}-${{ matrix.config.cc }}-
            conan-${{ runner.os }}-

      - name: Install Conan packages
        run: >
          uv run conan install .
          -b missing -pr:a default ${{ matrix.config.profiles }}
          -c:a tools.cmake.cmaketoolchain:generator=Ninja
          -c:h tools.build:compiler_executables="{\"c\": \"${{ matrix.config.cc }}\", \"cpp\": \"${{ matrix.config.cxx }}\"}"
          -s:h build_type=${{ matrix.build.type }}

      - name: Configure
        if: matrix.build.type != 'Debug'
        run: >
          uv run cmake --preset ${{ matrix.build.preset }}
          -D ENABLE_COVERAGE:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_ASAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_UBSAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_LSAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_CPPCHECK:BOOL=TRUE
          -D CMAKE_CXX_CPPCHECK:STRING="cppcheck -v --enable=all --check-level=exhaustive --inline-suppr --error-exitcode=42 --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppressions-list=${{ github.workspace }}/cppcheck.suppressions"
          -D ENABLE_CLANG_TIDY:BOOL=${{ contains(matrix.config.cc, 'clang') }}
          -D ENABLE_HARDENINGS:BOOL=TRUE
          -D ENABLE_FORTIFY_SOURCE:BOOL=${{ matrix.build.type != 'Debug' }}

      - name: Build
        if: matrix.build.type != 'Debug'
        run: uv run cmake --build --preset ${{ matrix.build.preset }}

      - name: Run tests
        if: matrix.build.type != 'Debug'
        run: uv run ctest --preset ${{ matrix.build.preset }}

      - name: Collect test coverage
        if: matrix.build.type == 'Debug'
        run: |
          uv run cmake --preset ${{ matrix.build.preset }} \
            -D ENABLE_COVERAGE:BOOL=TRUE \
            -D ENABLE_ASAN:BOOL=FALSE \
            -D ENABLE_UBSAN:BOOL=FALSE \
            -D ENABLE_LSAN:BOOL=FALSE \
            -D ENABLE_CPPCHECK:BOOL=TRUE \
            -D CMAKE_CXX_CPPCHECK:STRING="cppcheck -v --enable=all --check-level=exhaustive --inline-suppr --error-exitcode=42 --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppressions-list=${{ github.workspace }}/cppcheck.suppressions" \
            -D ENABLE_CLANG_TIDY:BOOL=${{ contains(matrix.config.cc, 'clang') }} \
            -D ENABLE_HARDENINGS:BOOL=TRUE \
            -D ENABLE_FORTIFY_SOURCE:BOOL=FALSE
          uv run cmake --build --preset ${{ matrix.build.preset }}
          uv run ctest --preset ${{ matrix.build.preset }}
          mkdir -p coverage
          uv run gcovr --gcov-executable '${{ matrix.config.gcov }}'

      - name: Upload coverage to Codecov
        if: matrix.build.type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  build_macos:
    name: ${{ matrix.config.name }} ${{ matrix.build.type }}
    runs-on: xcode-27
    strategy:
      matrix:
        build:
          - {
              type: Debug,
              preset: conan-debug
            }
          - {
              type: RelWithDebInfo,
              preset: conan-relwithdebinfo
            }
        config:
          - {
              name: 'Macos Clang',
              cc: $(brew --prefix llvm@23)/bin/clang,
              cxx: $(brew --prefix llvm@23)/bin/clang++,
              profiles: '-pr:h conan/clang23 -pr:h conan/libc++'
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "CONAN_HOME=${{ runner.temp }}/.conan2" >> ${{ github.env }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          brew install llvm@23
          uv sync
          uv run conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ runner.os }}-clang-${{ matrix.build.type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-clang-${{ matrix.build.type }}-
            conan-${{ runner.os }}-clang-
            conan-${{ runner.os }}-

      - name: Install Conan packages
        run: >
          uv run conan install .
          -b missing -pr:a default ${{ matrix.config.profiles }}
          -c:a tools.cmake.cmaketoolchain:generator=Ninja
          -c:h tools.build:compiler_executables="{\"c\": \"${{ matrix.config.cc }}\", \"cpp\": \"${{ matrix.config.cxx }}\"}"
          -s:h build_type=${{ matrix.build.type }}

      - name: Configure
        if: matrix.build.type != 'Debug'
        run: >
          uv run cmake --preset ${{ matrix.build.preset }}
          -D ENABLE_COVERAGE:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_ASAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_UBSAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_LSAN:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_HARDENINGS:BOOL=TRUE
          -D ENABLE_FORTIFY_SOURCE:BOOL=${{ matrix.build.type != 'Debug' }}

      - name: Build
        if: matrix.build.type != 'Debug'
        run: uv run cmake --build --preset ${{ matrix.build.preset }}

      - name: Run tests
        if: matrix.build.type != 'Debug'
        run: uv run ctest --preset ${{ matrix.build.preset }}

      - name: Collect test coverage
        if: matrix.build.type == 'Debug'
        run: |
          uv run cmake --preset ${{ matrix.build.preset }} \
            -D ENABLE_COVERAGE:BOOL=TRUE \
            -D ENABLE_ASAN:BOOL=FALSE \
            -D ENABLE_UBSAN:BOOL=FALSE \
            -D ENABLE_LSAN:BOOL=FALSE \
            -D ENABLE_HARDENINGS:BOOL=TRUE \
            -D ENABLE_FORTIFY_SOURCE:BOOL=FALSE
          uv run cmake --build --preset ${{ matrix.build.preset }}
          uv run ctest --preset ${{ matrix.build.preset }}
          mkdir -p coverage
          uv run gcovr --gcov-executable "$(brew --prefix llvm@23)/bin/llvm-cov gcov"

      - name: Upload coverage to Codecov
        if: matrix.build.type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  build_windows:
    name: ${{ matrix.config.name }} ${{ matrix.build.type }}
    runs-on: windows-2025-vs2026
    env:
      GTEST_DISCOVERY_TIMEOUT: 60
    strategy:
      matrix:
        build:
          - {
              type: Debug,
              preset: conan-debug
            }
          - {
              type: RelWithDebInfo,
              preset: conan-relwithdebinfo
            }
        config:
          - {
              name: 'Windows MSVC',
              cc: cl,
              cxx: cl,
              profiles: '-pr:h conan/msvc195-md'
            }
          # - {
          #     name: 'Windows Clang',
          #     cc: clang-cl,
          #     cxx: clang-cl,
          #     profiles: '-pr:h conan/clang20'
          #   }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "CONAN_HOME=${{ runner.temp }}/.conan2" >> ${{ github.env }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          choco install opencppcoverage
          uv sync
          uv run conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-
            conan-${{ runner.os }}-${{ matrix.config.cc }}-
            conan-${{ runner.os }}-

      - name: Install Conan packages
        run: >
          uv run conan install .
          -b missing -pr:a default ${{ matrix.config.profiles }}
          -c:a tools.cmake.cmaketoolchain:generator=Ninja
          -c:h tools.env.virtualenv:powershell=pwsh
          -c:h tools.build:compiler_executables="{'c': '${{ matrix.config.cc }}', 'cpp': '${{ matrix.config.cxx }}'}"
          -s:h build_type=${{ matrix.build.type }}

      - name: Configure
        if: matrix.build.type != 'Debug'
        run: >
          build/${{ matrix.build.type }}/generators/conanbuild.ps1 &&
          uv run cmake --preset ${{ matrix.build.preset }}
          -D ENABLE_COVERAGE:BOOL=${{ matrix.build.type == 'Debug' }}
          -D ENABLE_ASAN:BOOL=${{ matrix.build.type == 'Debug' && matrix.config.cc == 'cl' }}
          -D ENABLE_HARDENINGS:BOOL=TRUE

      - name: Build
        if: matrix.build.type != 'Debug'
        run: >
          build/${{ matrix.build.type }}/generators/conanbuild.ps1 &&
          uv run cmake --build --preset ${{ matrix.build.preset }}

      - name: Run tests
        if: matrix.build.type != 'Debug'
        run: uv run ctest --preset ${{ matrix.build.preset }}

      - name: Run tests and collect test coverage
        if: matrix.build.type == 'Debug'
        run: |
          build/${{ matrix.build.type }}/generators/conanbuild.ps1
          uv run cmake --preset ${{ matrix.build.preset }} `
            -D ENABLE_COVERAGE:BOOL=TRUE `
            -D ENABLE_ASAN:BOOL=FALSE `
            -D ENABLE_HARDENINGS:BOOL=TRUE
          uv run cmake --build --preset ${{ matrix.build.preset }}
          New-Item -ItemType Directory -Force coverage | Out-Null
          $openCppCoverage = "${env:ProgramFiles}\OpenCppCoverage\OpenCppCoverage.exe"
          if (!(Test-Path $openCppCoverage)) { throw "OpenCppCoverage not found at $openCppCoverage" }
          & $openCppCoverage --export_type cobertura:coverage/cobertura.xml --cover_children -- uv run ctest --preset ${{ matrix.build.preset }}

      - name: Upload coverage to Codecov
        if: matrix.build.type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  codeql:
    name: CodeQL
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        build:
          - {
              type: Release,
              preset: conan-release
            }
        config:
          - {
              cc: gcc-15,
              cxx: g++-15,
              profiles: '-pr:h conan/gcc15'
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "CONAN_HOME=${{ runner.temp }}/.conan2" >> ${{ github.env }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.3
        with:
          languages: cpp

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync
          uv run conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ runner.os }}-${{ matrix.config.cc }}-${{ matrix.build.type }}-
            conan-${{ runner.os }}-${{ matrix.config.cc }}-
            conan-${{ runner.os }}-

      - name: Install Conan packages
        run: >
          uv run conan install .
          -b missing -pr:a default ${{ matrix.config.profiles }}
          -c:a tools.cmake.cmaketoolchain:generator=Ninja
          -c:h tools.build:compiler_executables="{\"c\": \"${{ matrix.config.cc }}\", \"cpp\": \"${{ matrix.config.cxx }}\"}"
          -s:h build_type=${{ matrix.build.type }}

      - name: Configure
        run: uv run cmake --preset ${{ matrix.build.preset }}

      - name: Build
        run: uv run cmake --build --preset ${{ matrix.build.preset }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.3

  analyze:
    name: Analyze
    runs-on: windows-2025-vs2026
    strategy:
      matrix:
        build:
          - {
              type: Release,
              preset: conan-release
            }
        config:
          - {
              cc: cl,
              cxx: cl,
              profiles: '-pr:h conan/msvc195-md'
            }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "CONAN_HOME=${{ runner.temp }}/.conan2" >> ${{ github.env }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: |
          uv sync
          uv run conan profile detect

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Install Conan packages
        run: >
          uv run conan install .
          -b missing -pr:a default ${{ matrix.config.profiles }}
          -c:a tools.cmake.cmaketoolchain:generator=Ninja
          -c:h tools.env.virtualenv:powershell=pwsh
          -c:h tools.build:compiler_executables="{'c': '${{ matrix.config.cc }}', 'cpp': '${{ matrix.config.cxx }}'}"
          -s:h build_type=${{ matrix.build.type }}

      - name: Configure
        run: >
          build/${{ matrix.build.type }}/generators/conanbuild.ps1 &&
          uv run cmake --preset ${{ matrix.build.preset }}

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@main
        id: run-analysis
        with:
          cmakeBuildDirectory: ./build/${{ matrix.build.type }}
          buildConfiguration: ${{ matrix.build.type }}
          ruleset: NativeRecommendedRules.ruleset

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
